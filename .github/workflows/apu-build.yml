name: Build LCD APU package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apu-build.yml'
      - 'drivers/apu/build.ps1'
      - 'drivers/apu/adapt_extension_reference.py'
      - 'drivers/apu/manifests/**'
      - 'drivers/apu/installer/**'
      - 'drivers/apu/lab/src/**'
      - 'tools/**'

permissions:
  contents: read

concurrency:
  group: apu-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        shell: pwsh
        run: python -m pip install -r drivers/apu/lab/requirements.txt
      - name: Check publication and Python safety tests
        shell: pwsh
        run: |
          python tools/check_publication.py
          if ($LASTEXITCODE -ne 0) { throw 'Publication check failed.' }
          python -m unittest discover -s drivers/apu/lab/tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Python safety tests failed.' }
          python -m unittest discover -s drivers/apu/tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Extension reference tests failed.' }
      - name: Check Windows PowerShell protocols and staging invariants
        shell: powershell
        run: |
          & drivers/apu/lab/tests/test_normal_boot.ps1
          & drivers/apu/lab/tests/test_guarded_reload.ps1
          & drivers/apu/tests/test_staging.ps1
      - name: Download, adapt and validate exact donor
        shell: powershell
        run: |
          & drivers/apu/build.ps1 -RegisterVendorCatalogs
          if ($LASTEXITCODE -ne 0) { throw 'APU build failed.' }
      - name: Upload configuration-only driver and setup suite
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deckup-apu-32.0.21043.21001-config
          path: build/apu/bundle/
          retention-days: 90
          if-no-files-found: error
          compression-level: 6
      - name: Write build result
        shell: pwsh
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          $manifest = Get-Content build/apu/bundle/manifest.json -Raw | ConvertFrom-Json
          @"
          ## LCD APU package prepared
          Donor: ASUS $($manifest.DriverVersion). Variant: configuration-only.
          Kernel and all executables are unchanged. Seven checksum/revision emulator cases passed.
          [Download artifact]($env:ARTIFACT_URL) (retained 90 days).
          Artifact SHA-256: $env:ARTIFACT_DIGEST
          Stage.cmd stages only; it does not activate/reload a GPU or change boot settings.
          This runner validated the build, not installation/boot/sleep on another Deck.
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY
